name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash --version | head -1; which bash awk sed grep git
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: shellcheck -s bash -S warning skills/rules2hooks/scripts/scoped-guidance.sh
